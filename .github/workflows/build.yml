name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: whisper-model-ggml-base.en-q5_1

      - name: Fetch whisper.cpp and model
        run: ./scripts/setup.sh

      # The on-device grammar model is downloaded by the app at runtime; make sure that link is alive.
      - name: Check on-device model URL
        continue-on-error: true
        run: |
          URL="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          CODE=$(curl -sL -r 0-0 -o /dev/null -w '%{http_code}' "$URL")
          echo "Model URL answered: $CODE"
          if [ "$CODE" != "206" ] && [ "$CODE" != "200" ]; then
            echo "::warning::On-device model URL answered $CODE, so the in-app download may fail."
            exit 1
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/handy.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/handy.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret, so this build uses the debug key and is not published."
          fi

      - name: Unit tests and release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk handy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: handy-apk
          path: handy.apk

      # Publishes a Release, but only for builds signed with the real key, so users never get a mismatched APK.
      - name: Publish release
        if: github.event_name != 'pull_request' && env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Handy build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: handy.apk
