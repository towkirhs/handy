name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: whisper-model-ggml-base.en-q5_1

      - name: Fetch whisper.cpp and model
        run: ./scripts/setup.sh

      - name: Unit tests and release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk handy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: handy-apk
          path: handy.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: handy.apk
