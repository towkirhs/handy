plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def modelAsset = 'ggml-base.en-q5_1.bin'

android {
    namespace 'com.towkirhs.handy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.towkirhs.handy'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // CI passes the signing key through environment variables (from GitHub secrets).
    // Without them the build falls back to the debug key, which can't update older installs.
    def keystorePath = System.getenv('KEYSTORE_FILE')
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    // The Whisper model is read straight from the APK, so keep it uncompressed.
    androidResources {
        noCompress 'bin'
    }

    lint {
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// Fail early with a clear message instead of shipping an APK that can't transcribe.
tasks.matching { it.name == 'preBuild' }.configureEach {
    doFirst {
        if (!file("src/main/assets/models/${modelAsset}").exists()) {
            throw new GradleException("Whisper model missing. Run ./scripts/setup.sh first.")
        }
    }
}

dependencies {
    implementation project(':whisper')

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'

    testImplementation 'junit:junit:4.13.2'
}
